spring:
  application:
    name: mock-interview-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}

# Custom API Configurations

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  groq:
    api-key: ${GROQ_API_KEY}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
    model: ${GROQ_MODEL:llama-3.1-8b-instant}

  deepgram:
    api-key: ${DEEPGRAM_API_KEY}
    api-url: ${DEEPGRAM_API_URL:https://api.deepgram.com/v1/speak}

  brevo:
    sender-name: ${BREVO_SENDER_NAME:MockAI Support}