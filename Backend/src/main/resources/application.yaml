spring:
  application:
    name: analyzer

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: ${BREVO_SMTP_HOST}
    port: ${BREVO_SMTP_PORT}
    username: ${BREVO_SMTP_USERNAME}
    password: ${BREVO_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # CORS Configuration - Read from environment variables
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:*}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
      max-age: ${CORS_MAX_AGE:3600}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:9a4f2c8d7b6e5a4f3c2b1a0d9e8f7c6b5a4f3c2b1a0d9e8f7c6b5a4f3c2b1a0d}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  email:
    sender: ${BREVO_SENDER_EMAIL:rockrangerz801@gmail.com}
    sender-name: ${BREVO_SENDER_NAME:Resume Analyzer}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
    domain: ${COOKIE_DOMAIN:}
    max-age-seconds: ${COOKIE_MAX_AGE:86400}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

groq:
  api-key: ${GROQ_API_KEY}
  api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  api-model: ${GROQ_API_MODEL:openai/gpt-oss-120b}
  stt-url: ${GROQ_STT_URL:https://api.groq.com/openai/v1/audio/transcriptions}
  stt-model: ${GROQ_STT_MODEL:whisper-large-v3-turbo}
  tts-url: ${GROQ_TTS_URL:https://api.groq.com/openai/v1/audio/speech}
  tts-model: ${GROQ_TTS_MODEL:canopylabs/orpheus-v1-english}
  tts-voice: ${GROQ_TTS_VOICE:hannah}